<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradDock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Dock Body -->
  <rect x="40" y="70" width="160" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="52" y="80" width="136" height="8" rx="4" fill="url(#gradDock)"/>
  
  <!-- Ports -->
  <!-- HDMI / DP Ports -->
  <rect x="55" y="110" width="22" height="14" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <rect x="85" y="110" width="22" height="14" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- USB Type A Ports -->
  <rect x="115" y="112" width="20" height="10" rx="2" fill="#0284c7"/>
  <rect x="142" y="112" width="20" height="10" rx="2" fill="#0284c7"/>
  <rect x="169" y="112" width="20" height="10" rx="2" fill="#0284c7"/>
  
  <!-- Type C PD Ports -->
  <rect x="55" y="140" width="24" height="8" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="88" y="140" width="24" height="8" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- SD Card Slots -->
  <line x1="125" y1="144" x2="155" y2="144" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="144" x2="185" y2="144" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
</svg>
