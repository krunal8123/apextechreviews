<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amazonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Search Magnifier -->
  <circle cx="230" cy="220" r="100" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round"/>
  <line x1="305" y1="295" x2="390" y2="380" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round"/>

  <!-- Amazon Smile Arrow inside glass reflection -->
  <path d="M170 370 C 230 420, 310 420, 370 370" fill="none" stroke="url(#amazonGrad)" stroke-width="20" stroke-linecap="round"/>
  <polygon points="360,355 385,372 355,385" fill="url(#amazonGrad)"/>
</svg>
